[package]
name = "openfga-language"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenFGA DSL parser and model lowering for no_std"
readme = "README.md"
documentation = "https://docs.rs/openfga-language"
keywords = ["openfga", "authorization", "zanzibar", "dsl", "no-std"]
categories = ["authentication", "parser-implementations", "no-std"]

[dependencies]
openfga-model = { version = "0.1.0", path = "../openfga-model" }
pest = { version = "2.8", default-features = false }
pest_derive = { version = "2.8", default-features = false }
saphyr-parser = { version = "0.4.0", default-features = false }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

[lints]
workspace = true
